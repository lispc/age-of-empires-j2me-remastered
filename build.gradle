plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'aoe.Main'
}

run {
    // 默认开调试状态行（[dbg]/[trace]/[view] 等；run.sh 会把输出留成日志文件）。
    // 想要安静窗口：AOE_QUIET=1 ./run.sh
    if (!System.getenv('AOE_QUIET')) {
        jvmArgs '-Daoe.debug=1'
    }
}
